<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio | HB</title>
  <meta name="description" content="Draft and manage HB articles and essays in a writing-first local Studio.">
  <meta name="theme-color" content="#eef2ff">
  <meta property="og:title" content="Studio | HB">
  <meta property="og:description" content="Draft and manage HB articles and essays in a writing-first local Studio.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://smangat1.github.io/cs-law-publication/editor.html">
  <meta property="og:site_name" content="HB">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://smangat1.github.io/cs-law-publication/editor.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="HB RSS" href="rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="publication.css">
</head>
<body class="studio-body">
  <main class="studio-app">
    <header class="studio-appbar">
      <div class="studio-appbar-left">
        <a class="studio-back" href="index.html" aria-label="Return to site">HB.</a>
        <span id="editor-status-pill" class="studio-status-pill">Draft</span>
      </div>

      <div class="studio-appbar-right">
        <button id="toggle-preview-button" class="studio-appbar-button studio-appbar-button-muted" type="button">Preview</button>
        <button id="new-piece-button" class="studio-appbar-button studio-appbar-button-muted" type="button">New</button>
        <button id="export-content-button" class="studio-appbar-button" type="button">Export JSON</button>
      </div>
    </header>

    <section class="studio-toolbar">
      <button class="studio-tool" type="button" data-insert="**bold**">B</button>
      <button class="studio-tool" type="button" data-insert="_italic_">I</button>
      <button class="studio-tool" type="button" data-insert="\n\n## Section heading\n\n">H2</button>
      <button class="studio-tool" type="button" data-insert="\n\n> Pull quote\n\n">Quote</button>
      <button class="studio-tool" type="button" data-insert="\n\n- Point one\n- Point two\n\n">List</button>
      <button class="studio-tool" type="button" data-insert="\n\n---\n\n">Rule</button>
    </section>

    <div class="studio-layout">
      <form id="piece-form" class="studio-editor-shell">
        <input id="piece-id" name="id" type="hidden">

        <div class="studio-editor-canvas">
          <div class="studio-cover-row">
            <label class="studio-cover-button" for="piece-thumbnail">Add cover image</label>
            <input id="piece-thumbnail" name="thumbnail" type="file" accept="image/*" hidden>
            <p id="thumbnail-note" class="studio-inline-note">Recommended: 1200 x 630.</p>
          </div>

          <div id="studio-cover-preview" class="studio-cover-preview" hidden></div>

          <input id="piece-title" class="studio-title-input" name="title" type="text" placeholder="Title" required>
          <textarea id="piece-dek" class="studio-dek-input" name="dek" rows="2" placeholder="Add a subtitle..." required></textarea>

          <div class="studio-meta-strip">
            <input id="piece-category" class="studio-chip-input" name="category" type="text" placeholder="Topic" required>
            <input id="piece-author" class="studio-chip-input" name="author" type="text" placeholder="Byline">
            <select id="piece-type" class="studio-chip-input" name="type">
              <option value="article">Article</option>
              <option value="essay">Essay</option>
            </select>
            <input id="piece-read-time" class="studio-chip-input" name="readTime" type="text" placeholder="8 min read" required>
          </div>

          <textarea id="piece-body" class="studio-body-input" name="body" rows="18" placeholder="Start writing..." required></textarea>
        </div>

        <aside class="studio-inspector">
          <div class="studio-inspector-card">
            <p class="eyebrow">Publishing</p>

            <label>
              Status
              <select id="piece-status" name="status">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
              </select>
            </label>

            <label>
              Publish date
              <input id="piece-published-at" name="publishedAt" type="date">
            </label>

            <label>
              Issue
              <input id="piece-issue" name="issue" type="text" placeholder="issue-001">
            </label>

            <p id="editor-status-note" class="form-note">Creating a new local piece.</p>

            <div class="studio-inspector-actions">
              <button id="save-piece-button" class="studio-appbar-button" type="submit">Save draft</button>
              <button id="delete-piece-button" class="studio-appbar-button studio-appbar-button-danger" type="button" hidden>Delete</button>
            </div>
          </div>

          <div class="studio-inspector-card studio-preview-card" id="preview-panel" hidden>
            <p class="eyebrow">Live preview</p>
            <div class="featured-lead preview-card" id="preview-card"></div>
            <article class="page-hero preview-article" id="preview-article"></article>
          </div>
        </aside>
      </form>

      <section class="studio-library">
        <div class="studio-library-head">
          <div>
            <p class="eyebrow">Studio Library</p>
            <h2>Drafts and local pieces</h2>
          </div>
          <p class="page-copy">Publish to surface a piece publicly. Export when you want repo-ready content.</p>
        </div>
        <div id="saved-pieces" class="studio-piece-list"></div>
      </section>
    </div>
  </main>

  <script src="pieces.js"></script>
  <script src="editor.js"></script>
</body>
</html>
